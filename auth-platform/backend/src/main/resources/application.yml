# JWT配置
auth:
  jwt:
    secret: YXV0aC1wbGF0Zm9ybS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNA==
    expiration: 7200000       # Redis session TTL（2小时）；JWT 本身设 30 天兜底
    issuer: auth-platform

# 跨域配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.auth.platform: debug
