server:
  port: 8081

spring:
  application:
    name: product-app
  datasource:
    url: jdbc:mysql://localhost:3306/product_app?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 16379
      password:
      database: 1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置 (Product App自己的JWT)
app:
  jwt:
    secret: cHJvZHVjdC1hcHAtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLTIwMjQ=
    expiration: 7200000
    refresh-expiration: 604800000
    issuer: product-app

# OAuth2配置 - 对接Auth Platform
oauth2:
  auth-server:
    base-url: http://localhost:8080
    authorize-uri: /oauth2/authorize
    token-uri: /oauth2/token
    userinfo-uri: /api/oauth2/userinfo
    jwks-uri: /.well-known/jwk-set.json
  client:
    client-id: product-app
    client-secret: admin123
    redirect-uri: http://localhost:5174/oauth/callback
    scope: openid,profile,email

# 跨域
cors:
  allowed-origins: http://localhost:5174
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

logging:
  level:
    com.product.app: debug
